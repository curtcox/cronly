name = "cronly-local"
main = "src/platform.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
ENVIRONMENT = "local"
APP_ORIGIN = "http://localhost:8787"
# devicebasedauth.org issuer (S5). Its dev:local also defaults to port 8787: run one of them
# on another port, e.g. DBA_ISSUER = "http://localhost:8788", and register
# http://localhost:8787/auth/dba/callback for client cronly.org there.
DBA_ISSUER = "https://devicebasedauth.org"

SECRETS_MASTER_KEY = "local-only-master-key-never-use-in-production"
TOKEN_SIGNING_KEY = "local-only-signing-key-never-use-in-production"

# Production secrets are not used in local mode:
# CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_WEBHOOK_SECRET,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SECRETS_MASTER_KEY,
# TOKEN_SIGNING_KEY, ANTHROPIC_API_KEY
# Optional SECRETS_KEYRING replaces the local master key for rotation acceptance.
# Optional: CLOUDFLARE_ANALYTICS_TOKEN, CLOUDFLARE_ACCOUNT_ID, ALERT_WEBHOOK_URL
# Required for live runs: COST_SAFETY_DO_NAMESPACES (comma-separated cronly namespace IDs).
# JS_ACCEPTANCE_ACCOUNT allows the owner to perform live acceptance; JS_LIVE_ACCEPTED=true unlocks JS after acceptance.
# COST_SAFETY_HARD_STOP=true provides an immediate operator brake.

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO", "JobDO"]

[[queues.producers]]
binding = "RUN_QUEUE"
queue = "cronly-runs"

[[queues.consumers]]
queue = "cronly-runs"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3

[triggers]
crons = ["0 2 * * *"]

[limits]
cpu_ms = 50

[[worker_loaders]]
binding = "LOADER"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SafetyDO"]

[[durable_objects.bindings]]
name = "DBA_LINKS"
class_name = "DbaLinkDO"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DbaLinkDO"]

# devicebasedauth.org revocation webhook pushes (S5) and the DPoP replay cache shared by every
# isolate, so a captured proof works once across all of them (vendored ReplayCacheDO).
[[durable_objects.bindings]]
name = "DBA_REVOCATIONS"
class_name = "DbaRevocationsDO"

[[durable_objects.bindings]]
name = "DBA_REPLAY"
class_name = "DbaReplayCacheDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DbaRevocationsDO", "DbaReplayCacheDO"]

[[ratelimits]]
name = "PUBLIC_LIMITER"
namespace_id = "1001"
simple = { limit = 240, period = 60 }
