name: Deploy production
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CRONLY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_CREDIT_PRODUCT_ID: ${{ vars.CRONLY_STRIPE_CREDIT_PRODUCT_ID }}
      STRIPE_CARD_COST_PRODUCT_ID: ${{ vars.CRONLY_STRIPE_CARD_COST_PRODUCT_ID }}
      SECRETS_MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
      SECRETS_KEYRING: ${{ secrets.SECRETS_KEYRING }}
      TOKEN_SIGNING_KEY: ${{ secrets.TOKEN_SIGNING_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      JS_ACCEPTANCE_ACCOUNT: ${{ secrets.JS_ACCEPTANCE_ACCOUNT }}
      COST_SAFETY_DO_NAMESPACES: ${{ vars.CRONLY_DO_NAMESPACES }}
      COST_SAFETY_HARD_STOP: ${{ vars.CRONLY_COST_SAFETY_HARD_STOP }}
      LAUNCH_APPROVED: ${{ vars.CRONLY_LAUNCH_APPROVED }}
      JS_LIVE_ACCEPTED: ${{ vars.CRONLY_JS_LIVE_ACCEPTED }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/operator-profile.mjs --require-complete
        if: vars.CRONLY_LAUNCH_APPROVED == 'true'
      - run: node scripts/check-deployment-secrets.mjs
      - run: node scripts/deploy-worker.mjs
      - run: node scripts/push-worker-secrets.mjs
      - run: npm run verify:production
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
