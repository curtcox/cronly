name = "cronly"
main = "src/platform.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "cronly.org", custom_domain = true }]

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true
# Public links and verification use explicit .html URLs.
html_handling = "none"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://cronly.org"
# devicebasedauth.org issuer for device credentials and account linking (S5).
DBA_ISSUER = "https://devicebasedauth.org"

# Required secrets, uploaded by CI before deployment:
# CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_WEBHOOK_SECRET,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# TOKEN_SIGNING_KEY; ANTHROPIC_API_KEY required for launch-approved deploys/prose.
# SECRETS_MASTER_KEY or SECRETS_KEYRING (atomic JSON: {"active":"v2","keys":{...}}).
# Keep previous keys until all accounts and in-flight snapshots have migrated; docs/ops/secret-rotation.md.
# Optional: CLOUDFLARE_ANALYTICS_TOKEN, CLOUDFLARE_ACCOUNT_ID, ALERT_WEBHOOK_URL
# Optional: DBA_API_KEY (a cronly.org audience-owner key at devicebasedauth.org) enables online
# decisions for gated, step-up, use-limited and require.online grants; without it they answer 403.
# Optional: DBA_RTT_SECRET (32+ random characters) times DPoP challenges for DBA latency rules;
# without it grants with net.client.latency are refused.
# LAUNCH_APPROVED=true only after Terms/Privacy and invite-only setup are approved.
# Required for live runs: COST_SAFETY_DO_NAMESPACES (comma-separated cronly namespace IDs).
# JS_ACCEPTANCE_ACCOUNT allows the owner to perform live acceptance; JS_LIVE_ACCEPTED=true unlocks JS after acceptance.
# COST_SAFETY_HARD_STOP=true provides an immediate operator brake.
# CI preserves dashboard variables; CRONLY_COST_SAFETY_HARD_STOP explicitly sets/clears this brake.
# Required payment catalog vars: STRIPE_CREDIT_PRODUCT_ID, STRIPE_CARD_COST_PRODUCT_ID.
# CI maps these from CRONLY_STRIPE_CREDIT_PRODUCT_ID and CRONLY_STRIPE_CARD_COST_PRODUCT_ID.

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO", "JobDO"]

[[queues.producers]]
binding = "RUN_QUEUE"
queue = "cronly-runs"

[[queues.consumers]]
queue = "cronly-runs"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3

[triggers]
crons = ["0 2 * * *"]

[limits]
cpu_ms = 50

[[worker_loaders]]
binding = "LOADER"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SafetyDO"]

[[durable_objects.bindings]]
name = "DBA_LINKS"
class_name = "DbaLinkDO"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["DbaLinkDO"]

# devicebasedauth.org revocation webhook pushes (S5) and the DPoP replay cache shared by every
# isolate, so a captured proof works once across all of them (vendored ReplayCacheDO).
[[durable_objects.bindings]]
name = "DBA_REVOCATIONS"
class_name = "DbaRevocationsDO"

[[durable_objects.bindings]]
name = "DBA_REPLAY"
class_name = "DbaReplayCacheDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["DbaRevocationsDO", "DbaReplayCacheDO"]

[[ratelimits]]
name = "PUBLIC_LIMITER"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

[observability]
enabled = false
