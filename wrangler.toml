name = "cronly"
main = "src/index.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://cronly.org"

# Required secrets, uploaded by CI before deployment:
# CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, CLERK_WEBHOOK_SECRET,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SECRETS_MASTER_KEY,
# TOKEN_SIGNING_KEY, ANTHROPIC_API_KEY
# Optional: CLOUDFLARE_ANALYTICS_TOKEN, CLOUDFLARE_ACCOUNT_ID, ALERT_WEBHOOK_URL
# COST_SAFETY_HARD_STOP=true provides an immediate operator brake.

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO", "JobDO"]

[[queues.producers]]
binding = "RUN_QUEUE"
queue = "cronly-runs"

[[queues.consumers]]
queue = "cronly-runs"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3

[triggers]
crons = ["0 2 * * *"]

[limits]
cpu_ms = 50
